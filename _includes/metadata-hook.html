<!-- ============================================================================== -->
<!-- The Arc Archive - Enterprise Content Protection & Anti-Tampering Guard -->
<!-- Policy: Strict All-Block (Zero Copy, Zero Right-Click) + Blank Print Guard -->
<!-- ============================================================================== -->

<!-- 1. Security & Privacy Headers -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">

<!-- 2. Search Engine Verification Tags (Google & Naver) -->
<meta name="google-site-verification" content="113TaIRNxUyiZB62Yo3dZ3Dp4zq3rBqhhBspYkoTydc">
<meta name="naver-site-verification" content="3fb83b86f81bf6de931cbbc46f07d33be014c030">

<!-- 3. CSS-Level Enforced Selection, Drag Block & Print Blanks -->
<style id="strict-anti-copy-style">
  *, *::before, *::after {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }
  img, pre, code {
    -webkit-user-drag: none !important;
    user-drag: none !important;
  }
  /* Disable Chirpy's Code Copy Buttons completely */
  .code-header button,
  button[data-title-succeed],
  .btn-copy {
    display: none !important;
    pointer-events: none !important;
    visibility: hidden !important;
  }

  /* Anti-Print: Completely blank out on Ctrl/Cmd+P and PDF exports */
  @media print {
    html, body {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      overflow: hidden !important;
    }
  }
</style>

<script>
  (function() {
    'use strict';

    /* ========================================================================== */
    /* 1. Anti-Clickjacking Frame-Busting Guard                                   */
    /* ========================================================================== */
    if (window.top !== window.self) {
      try {
        if (window.top.location.hostname !== window.self.location.hostname) {
          window.top.location = window.self.location.href;
        }
      } catch (err) {
        window.top.location = window.self.location.href;
      }
    }

    /* ========================================================================== */
    /* 2. Self-Healing CSS Guard (Counters Chrome Extensions modifying user-select)*/
    /* ========================================================================== */
    function enforceAntiCopyCSS() {
      var style = document.getElementById('strict-anti-copy-style');
      if (!style) {
        style = document.createElement('style');
        style.id = 'strict-anti-copy-style';
        style.textContent = `
          *, *::before, *::after {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
          }
          img, pre, code {
            -webkit-user-drag: none !important;
            user-drag: none !important;
          }
          .code-header button, button[data-title-succeed], .btn-copy {
            display: none !important;
            pointer-events: none !important;
            visibility: hidden !important;
          }
          @media print {
            html, body {
              display: none !important;
              visibility: hidden !important;
              height: 0 !important;
              overflow: hidden !important;
            }
          }
        `;
        (document.head || document.documentElement).appendChild(style);
      }
    }

    if (window.MutationObserver) {
      var observer = new MutationObserver(function() {
        enforceAntiCopyCSS();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
    }
    setInterval(enforceAntiCopyCSS, 1000);
    document.addEventListener('DOMContentLoaded', enforceAntiCopyCSS);

    /* ========================================================================== */
    /* 3. Event Suppression in Capture Phase (Zero Copy, Zero Right-Click)        */
    /* ========================================================================== */
    var blockedEvents = ['contextmenu', 'selectstart', 'dragstart', 'copy', 'cut'];
    blockedEvents.forEach(function(eventType) {
      window.addEventListener(eventType, function(e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        if (e.clipboardData) {
          e.clipboardData.setData('text/plain', '');
        }
        return false;
      }, true);
    });

    /* ========================================================================== */
    /* 4. Anti-Tampering: Freeze Inline Event Properties                          */
    /* ========================================================================== */
    ['oncontextmenu', 'onselectstart', 'oncopy', 'oncut', 'ondragstart'].forEach(function(prop) {
      try {
        Object.defineProperty(document, prop, {
          get: function() { return function() { return false; }; },
          set: function() { return false; },
          configurable: false
        });
        Object.defineProperty(window, prop, {
          get: function() { return function() { return false; }; },
          set: function() { return false; },
          configurable: false
        });
      } catch (err) {}
    });

    /* ========================================================================== */
    /* 5. Keyboard Shortcut Suppression Guard                                     */
    /* ========================================================================== */
    window.addEventListener('keydown', function(e) {
      var isMeta = e.ctrlKey || e.metaKey;
      var key = e.key ? e.key.toLowerCase() : '';
      var keyCode = e.keyCode || e.which;

      if (keyCode === 123) { /* F12 */
        e.preventDefault();
        e.stopImmediatePropagation();
        return false;
      }

      if (isMeta) {
        /* C, X, A, U, S, P */
        if (key === 'c' || key === 'x' || key === 'a' || key === 'u' || key === 's' || key === 'p') {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
        /* DevTools shortcuts */
        if ((e.shiftKey || e.altKey) && (key === 'i' || key === 'j' || key === 'c')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
      }
    }, true);

  })();
</script>
